name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: [self-hosted, aur0]
    # go-version-file keeps the toolchain in lockstep with go.mod so the
    # loader can parse the module regardless of what Go the runner image
    # ships. golangci-lint v2.12.x is built with Go 1.26, which lifts the
    # old "package requires newer Go version" panic that forced this job
    # to run continue-on-error.
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  quality:
    # macOS coverage moved to nightly.yml; PR-time runs Linux only on the
    # aur0 self-hosted runner to avoid burning GitHub-hosted minutes.
    name: Lint and Test (Go ${{ matrix.go }})
    runs-on: [self-hosted, aur0]
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', 'stable']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
        shell: bash

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -v

  integration:
    name: Integration
    runs-on: [self-hosted, aur0]
    steps:
      - uses: actions/checkout@v6

      - name: Start SurrealDB
        run: |
          # On self-hosted runners a stopped container from an aborted
          # prior run can still own the name; idempotent removal avoids a
          # "container name already in use" 409.
          docker rm -f surrealdb >/dev/null 2>&1 || true
          # The runner is itself a container, so a host-published port
          # (-p 8000:8000) is not reachable via localhost from job steps
          # when the runner sits on a bridge network. Join SurrealDB to
          # this job's network namespace instead ($(hostname) is the
          # runner's container id); localhost:8000 then works no matter
          # how the runner container is networked.
          docker run -d \
            --name surrealdb \
            --network "container:$(hostname)" \
            surrealdb/surrealdb:v3.0.5 \
            start --user root --pass root memory
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then
              echo "SurrealDB ready"
              break
            fi
            echo "Waiting for SurrealDB... attempt $i"
            sleep 2
          done
          # Fail the step here if the server never came up, instead of
          # letting every test fail with connection errors later.
          curl -sf http://localhost:8000/health

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      # Race detector is disabled on the integration job because surrealdb.go
      # v1.4.0 has a known race in CloseLiveNotifications (Kill closes a
      # channel while handleResponse still writes to it). The unit-test job
      # still runs with -race to catch bugs in our own code.
      - name: Integration tests
        run: go test -tags=integration ./... -v
        env:
          SURREAL_URL: ws://localhost:8000
          SURREAL_USER: root
          SURREAL_PASS: root

      - name: Stop SurrealDB
        if: always()
        run: docker stop surrealdb || true

  goreleaser-check:
    name: goreleaser check
    runs-on: [self-hosted, aur0]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'release/')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
